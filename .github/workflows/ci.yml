name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check for committed secret values
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          patterns = [
              re.compile("sk-" + r"[A-Za-z0-9_-]{20,}"),
              re.compile("AKIA" + r"[0-9A-Z]{16}"),
              re.compile("BEGIN " + r"[A-Z ]*PRIVATE KEY"),
              re.compile("OPENAI_API_" + r"KEY=[^\s]{12,}"),
              re.compile("APP_AUTH_PASSWORD_" + r"HASH=pbkdf2_sha256\$[0-9]+\$[A-Za-z0-9+/=]{8,}\$[A-Za-z0-9+/=]{20,}"),
          ]
          excluded_suffixes = {".png", ".jpg", ".jpeg", ".pdf"}
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() in excluded_suffixes:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for line_number, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_number}")
          if hits:
              print("Potential committed secret values found:")
              print("\n".join(hits))
              sys.exit(1)
          PY
